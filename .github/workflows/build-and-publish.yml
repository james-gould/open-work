name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore & build backend
        run: |
          dotnet restore backend/OpenWork.sln
          dotnet build backend/OpenWork.sln --no-restore -c Release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  docker:
    name: Build & push container image
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    name: Deploy to Azure (opt-in)
    needs: docker
    runs-on: ubuntu-latest
    # This job is intentionally disabled until the Azure infra in infra/main.bicep has
    # been deployed (see DEPLOYMENT.md). Set the repository variable
    # ENABLE_AZURE_DEPLOY=true and the secrets/vars below once that's done - this job
    # only updates the already-deployed Container App's image, it does not provision
    # infrastructure.
    #
    # Auth uses GitHub OIDC federated credentials (no client secret stored anywhere) -
    # the CI tenant's policy disallows long-lived app secrets, so sp-open-work-ci has a
    # federated credential trusting repo:james-gould/open-work:ref:refs/heads/main.
    if: ${{ vars.ENABLE_AZURE_DEPLOY == 'true' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --image ghcr.io/${{ github.repository }}:${{ github.sha }}
